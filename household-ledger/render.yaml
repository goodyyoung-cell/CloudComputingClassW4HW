# Render Blueprint (선택 사항)
# 대시보드에서 수동으로 설정해도 되지만, 이 파일이 있으면
# "New + → Blueprint" 로 저장소를 가리키면 자동 구성됩니다.
services:
  - type: web
    name: household-ledger
    runtime: python
    plan: free
    pythonVersion: "3.12"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false   # 비밀값이므로 대시보드에서 직접 입력
